name: G0 contracts and governance
on:
  pull_request:
  push:
    branches: [main, 'docs/**']
jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check_contracts.py
      - run: python -m unittest discover -s tests/contracts -v
      - run: python scripts/check_governance.py
