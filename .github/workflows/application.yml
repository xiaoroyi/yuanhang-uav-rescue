name: Application checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock.txt
      - run: npm ci --prefix frontend
      - run: .venv/bin/python -m pytest tests -q
      - run: .venv/bin/python scripts/check_contracts.py
      - run: .venv/bin/python scripts/check_governance.py
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run test:unit
      - run: npm --prefix frontend run build
      - run: .venv/bin/python scripts/export_openapi.py && node frontend/scripts/generate-types.mjs
      - run: git diff --exit-code -- contracts/http/openapi.generated.json frontend/src/api/generated/http.d.ts
